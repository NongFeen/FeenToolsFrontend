name: Build static site

# Runs on every push to master -- your actual deployed branch (feature
# branches merge into dev, dev merges into dev-to-p to stage, dev-to-p
# merges into master to ship). Builds the static site, deploys it live to
# GitHub Pages, uploads a plain 14-day workflow artifact, and separately
# builds+pushes the nginx Docker image (frontend/Dockerfile) to ghcr.io --
# same registry/pattern as the backend repo's images, as a persistent
# versioned record and an alternate way to run this outside Pages if you
# ever need to. Requires one manual repo setting: Settings -> Pages ->
# Source: GitHub Actions (one-time, can't be set from this file).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Vite inlines VITE_* variables into the JS bundle at build time, so
      # this has to be set as a build-time env var, not read at runtime.
      # Set the actual backend URL in: repo Settings -> Secrets and
      # variables -> Actions -> Variables -> VITE_API_BASE_URL. Left empty
      # by default (same-origin), matching Dockerfile.combined's convention.
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 14

      # deploy-pages only accepts artifacts made by this action, not the
      # plain one above (that one's just for manual download).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  # deploy:
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: github-pages
  #     url: ${{ steps.deployment.outputs.page_url }}
  #   steps:
  #     - id: deployment
  #       uses: actions/deploy-pages@v5

  # Independent of build/deploy above -- frontend/Dockerfile does its own
  # npm ci + vite build internally, so this doesn't need dist/ from the
  # build job and can run in parallel rather than waiting on it.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io (like npm scopes earlier) requires a lowercase image name
      # even though the GitHub owner/repo casing isn't.
      - id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
